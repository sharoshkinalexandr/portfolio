name: Capture approved portfolio visuals

on:
  push:
    branches:
      - p0-privacy-hotfix-2026-10-23
    paths:
      - .github/workflows/capture-portfolio-visuals.yml

permissions:
  contents: write

jobs:
  screenshot-public-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the P0 working branch
        uses: actions/checkout@v4
        with:
          ref: p0-privacy-hotfix-2026-10-23
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Capture public website screenshots
        run: python scripts/capture_portfolio_visuals.py

      - name: Upload preview and audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-audit
          path: |
            img/portfolio-case-*.webp
            img/portfolio-screenshot-audit.json
          if-no-files-found: error

      - name: Commit successful screenshot captures to the working branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/portfolio-case-*.webp img/portfolio-screenshot-audit.json
          if git diff --cached --quiet; then
            echo "No images changed"
            exit 0
          fi
          git commit -m "Update case visuals from current company websites"
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$HEADER" push origin HEAD:refs/heads/p0-privacy-hotfix-2026-10-23

# P0 screenshot iteration 2: dismiss popups and select Human&Business brand section.
